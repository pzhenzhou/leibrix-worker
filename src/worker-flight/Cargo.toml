[package]
name = "worker-flight"
version.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
arrow-flight = { version = "=56.2.0", features = ["flight-sql"] }
arrow = { version = "=56.2.0" }
arrow-schema = "=56.2.0"
arrow-ipc = "=56.2.0"
# Use workspace tonic (already has tls-webpki-roots feature enabled)
tonic = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DuckDB for stage execution
duckdb = { version = "1.4.2", features = ["bundled"] }
dashmap = { workspace = true }
tokio-stream = "0.1"

# Internal dependency
worker-storage = { path = "../worker-storage" }
tracing-subscriber = "0.3.22"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
bytes = "1"
